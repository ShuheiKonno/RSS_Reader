<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>RSS Reader</title>
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <div class="layout">
      <!-- ============================ 左: フィード + キーワードフィルタ -->
      <aside class="sidebar">
        <header class="sidebar-head">
          <h1>RSS Reader</h1>
          <button id="refresh-all" class="btn btn-primary" type="button" title="すべてのフィードを更新">
            更新
          </button>
        </header>

        <form id="add-feed-form" class="add-feed" autocomplete="off">
          <label class="sr-only" for="feed-url">フィード URL</label>
          <input
            id="feed-url"
            type="text"
            placeholder="https://example.com/feed.xml"
            spellcheck="false"
          />
          <button class="btn" type="submit">追加</button>
        </form>
        <p id="add-feed-message" class="message" hidden></p>

        <nav class="feed-nav">
          <ul id="feed-list" class="feed-list"></ul>
        </nav>

        <section class="filters">
          <h2>キーワードフィルタ</h2>
          <form id="add-filter-form" class="add-filter" autocomplete="off">
            <label class="sr-only" for="filter-keyword">キーワード</label>
            <input id="filter-keyword" type="text" placeholder="キーワード" spellcheck="false" />
            <label class="sr-only" for="filter-mode">条件</label>
            <select id="filter-mode">
              <option value="exclude">除外する</option>
              <option value="include">含める</option>
            </select>
            <button class="btn" type="submit">追加</button>
          </form>
          <p id="add-filter-message" class="message" hidden></p>
          <ul id="filter-list" class="filter-list"></ul>
        </section>
      </aside>

      <!-- ============================================== 中央: 記事一覧 -->
      <main class="list-pane">
        <div class="toolbar">
          <div class="search-box">
            <label class="sr-only" for="search">記事を検索</label>
            <input id="search" type="search" placeholder="記事を検索（スペース区切りで AND）" />
          </div>
          <label class="check">
            <input id="unread-only" type="checkbox" />
            未読のみ
          </label>
          <label class="check" title="記事を選択したら自動で既読にする">
            <input id="auto-mark-read" type="checkbox" />
            開いたら既読
          </label>
          <label class="sr-only" for="sort-order">並び順</label>
          <select id="sort-order" title="並び順">
            <option value="newest">新しい順</option>
            <option value="oldest">古い順</option>
          </select>
          <button id="mark-all-read" class="btn" type="button" title="表示中の記事をすべて既読にする">
            すべて既読
          </button>
        </div>
        <p id="list-status" class="list-status"></p>
        <ul id="item-list" class="item-list" tabindex="0"></ul>
      </main>

      <!-- ============================================== 右: プレビュー -->
      <section id="preview" class="preview">
        <div id="preview-empty" class="preview-empty">
          <p>記事を選択すると内容を表示します。</p>
          <p class="hint">
            キーボード: <kbd>j</kbd>/<kbd>k</kbd> 移動 ・ <kbd>m</kbd> 既読切替 ・
            <kbd>o</kbd> 元記事を開く ・ <kbd>/</kbd> 検索
          </p>
        </div>
        <article id="preview-article" class="preview-article" hidden>
          <header class="preview-head">
            <a id="preview-title" class="preview-title" target="_blank" rel="noopener noreferrer"></a>
            <p id="preview-meta" class="preview-meta"></p>
            <div class="preview-actions">
              <a id="preview-link" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                元記事を開く ↗
              </a>
              <button id="toggle-read" class="btn" type="button">未読にする</button>
            </div>
          </header>
          <div id="preview-body" class="preview-body"></div>
        </article>
      </section>
    </div>

    <script type="module" src="reader.js"></script>
  </body>
</html>
